apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: flux-system
spec:
  interval: 10m
  chart:
    spec:
      chart: loki
      version: "18.7.5"
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: flux-system
  targetNamespace: monitoring
  values:
    deploymentMode: Monolithic
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      storage:
        type: filesystem
      limits_config:
        allow_structured_metadata: true
        volume_enabled: true
      pattern_ingester:
        enabled: true
      ruler:
        enable_api: true
    singleBinary:
      nodeSelector:
        kubernetes.io/hostname: savior-6fc31951
      replicas: 1
      persistence:
        enabled: true
        size: 20Gi
    lokiCanary:
      enabled: true
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    ingester:
      replicas: 0
    querier:
      replicas: 0
    queryFrontend:
      replicas: 0
    queryScheduler:
      replicas: 0
    distributor:
      replicas: 0
    compactor:
      replicas: 0
    indexGateway:
      replicas: 0
    bloomCompactor:
      replicas: 0
    bloomGateway:
      replicas: 0
